name: bench-fm-helper
# Builds the benchmark-only Foundation Models bridge (needs the macOS 26 SDK). Not part of the app.
on:
  push:
    branches: [bench-local-arch]
    paths: ["bench/fm-helper/**", ".github/workflows/bench-fm-helper.yml"]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version && swiftc --version
      - run: swiftc -O -parse-as-library bench/fm-helper/main.swift -o fm-helper && file fm-helper
      - uses: actions/upload-artifact@v5
        with: { name: fm-helper, path: fm-helper }
